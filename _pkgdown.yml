url: https://mdjubayerhossain.com/metaXpress/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2C3E50"
    secondary: "#18BC9C"
    success: "#2ECC71"
    info: "#3498DB"
    warning: "#F39C12"
    danger: "#E74C3C"

home:
  title: "metaXpress: End-to-End Bulk RNA-seq Meta-Analysis"
  description: >
    A unified, reproducible pipeline for multi-study bulk RNA-seq meta-analysis
    in R — spanning data ingestion, harmonization, differential expression,
    meta-statistics, missing gene imputation, pathway enrichment, and reporting.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
        - text: "Getting started"
          href: articles/quickstart.html
        - text: "Case study: Alzheimer's disease brain meta-analysis"
          href: articles/case_study.html
        - text: "Full workflow: GEO to report"
          href: articles/full_workflow.html
        - text: "Downstream biology"
          href: articles/downstream_biology.html

reference:
  - title: "Package Overview"
    desc: "Top-level package documentation and architecture."
    contents:
      - metaXpress-package

  - title: "S4 Data Structures"
    desc: "Core container classes for studies and meta-analysis results."
    contents:
      - metaXpressStudy-class
      - metaXpressStudy
      - mx_from_se
      - metaXpressResult-class
      - 'show,metaXpressStudy-method'
      - 'show,metaXpressResult-method'

  - title: "Module 1: Ingestion & Quality Control"
    desc: "Fetch studies from GEO/SRA, evaluate 10-point QC criteria, and filter datasets."
    contents:
      - mx_fetch_geo
      - mx_fetch_sra
      - mx_load_local
      - mx_qc_study
      - mx_filter_studies
      - mx_cluster_samples
      - mx_study_overview

  - title: "Module 2: Normalization & Cross-Study Harmonization"
    desc: "Reannotate gene IDs, harmonize library types, correct batch effects, and align gene spaces."
    contents:
      - mx_reannotate
      - mx_normalize
      - mx_correct_library_type
      - mx_remove_batch
      - mx_align_genes

  - title: "Module 3: Per-Study Differential Expression"
    desc: "Perform independent differential expression using DESeq2, edgeR, or limma-voom."
    contents:
      - mx_de
      - mx_de_all
      - mx_de_summary

  - title: "Module 4: Meta-Analysis Statistics"
    desc: "Random-effects (REML/PM/DL, HKSJ) and fixed-effect models, directional p-value combination, heterogeneity, concordance and leave-one-out robustness."
    contents:
      - mx_meta
      - mx_study_concordance
      - mx_heterogeneity
      - mx_sensitivity
      - mx_small_study

  - title: "Module 5: Missing Gene Handling"
    desc: "Identify missingness patterns across studies and apply imputation or coverage filtering."
    contents:
      - mx_impute
      - mx_filter_coverage
      - mx_missing_summary

  - title: "Module 6: Pathway Meta-Analysis"
    desc: "fgsea GSEA and ORA on the meta-signature, per-study GSEA combined across studies, consensus and redundancy filtering."
    contents:
      - mx_gene_sets
      - mx_pathway_meta
      - mx_pathway_studies
      - mx_pathway_consensus
      - mx_pathway_dedup
      - mx_pathway_heatmap

  - title: "Module 7: Visualization"
    desc: "Publication-grade plots including volcano plots, forest plots, heatmaps, and UpSet diagrams."
    contents:
      - mx_volcano
      - mx_forest
      - mx_heatmap
      - mx_upset
      - mx_heterogeneity_plot
      - mx_funnel

  - title: "Module 8: Reporting & Export"
    desc: "Generate reproducible HTML/PDF reports and export meta-analysis results."
    contents:
      - mx_report
      - mx_export
      - mx_session_info

  - title: "Module 9: Downstream Biology"
    desc: "Turn the meta-signature into biology: TF activity, cell composition, co-expression modules and drug reversal."
    contents:
      - mx_tf_activity
      - mx_cell_composition
      - mx_coexpression_modules
      - mx_drug_connectivity
      - mx_read_signatures
      - mx_downstream_plot

footer:
  left: "Developed by [Md. Jubayer Hossain](https://mdjubayerhossain.com) | [Hossain Lab](https://github.com/hossainlab)"
  right: "Built with [pkgdown](https://pkgdown.r-lib.org/) & Bootstrap 5"
